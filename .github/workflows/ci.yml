---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

jobs:
  test-typecheck-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.6.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK for example installation
        run: pnpm run build

      - name: Install credits example
        run: pnpm --dir examples/nextjs-credits install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build credits example
        run: pnpm --dir examples/nextjs-credits build
